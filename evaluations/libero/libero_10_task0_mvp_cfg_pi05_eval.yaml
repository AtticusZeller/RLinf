defaults:
  - env/libero_10@env.eval
  - model/pi0_5@rollout.model
  - _self_
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    # Two workers divide the 50 fixed Task 0 states exactly.
    env,rollout: 0-1

runner:
  task_type: embodied_eval
  logger:
    log_path: ../results
    project_name: rlinf
    experiment_name: libero_10_task0_mvp_cfg_pi05_eval
    logger_backends: [tensorboard, wandb]
  max_epochs: 1
  max_steps: -1
  only_eval: true
  val_check_interval: -1
  save_interval: -1
  resume_dir: null
  ckpt_path: ???

env:
  group_name: EnvGroup
  eval:
    rollout_epoch: 2
    task_id_filter: [0]
    total_num_envs: 50
    auto_reset: false
    ignore_terminations: true
    max_episode_steps: 520
    max_steps_per_rollout_epoch: 520
    group_size: 1
    use_fixed_reset_state_ids: true
    is_eval: true
    seed: ${oc.decode:${oc.env:RLINF_EXPERIMENT_SEED,0}}
    video_cfg:
      save_video: false
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: RolloutGroup
  generation_backend: huggingface
  recompute_logprobs: false
  unnorm_key: libero_10
  enable_offload: false
  pipeline_stage_num: 1
  model:
    model_path: ${oc.env:RLINF_PI05_MODEL_PATH,/mnt/data/atticux/rlinf/models/RLinf-Pi05-LIBERO-SFT}
    model_type: cfg_model
    num_action_chunks: 10
    num_steps: 5
    openpi:
      noise_level: 0.3
      cfgrl_guidance_scale: 1.0
      unconditional_prob: 0.1
      train_expert_only: false
      guidance_type: positive
      positive_only_conditional: true
