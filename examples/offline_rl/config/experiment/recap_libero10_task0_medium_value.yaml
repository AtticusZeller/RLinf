runner:
  logger:
    experiment_name: recap-medium-value
  max_epochs: -1
  max_steps: 2000
  val_check_interval: 500
  save_interval: 2000

data:
  tag: recap_task0_medium_seed${oc.env:RLINF_EXPERIMENT_SEED,0}_returns
  train_data_paths:
    - dataset_path: ${oc.env:RLINF_RECAP_MVP_DATA_ROOT}/libero10_task0_sft
      type: sft
      weight: 1.0
      robot_type: libero
      model_type: pi05
    - dataset_path: ${oc.env:RLINF_RECAP_MEDIUM_DATA_ROOT}/libero10_task0_train
      type: rollout
      weight: 1.0
      robot_type: libero
      model_type: pi05
  eval_data_paths:
    - dataset_path: ${oc.env:RLINF_RECAP_MVP_DATA_ROOT}/libero10_task0_eval
      max_samples: 2048
      robot_type: libero
      model_type: pi05
  seed: ${oc.decode:${oc.env:RLINF_EXPERIMENT_SEED,0}}

actor:
  seed: ${oc.decode:${oc.env:RLINF_EXPERIMENT_SEED,0}}
  model:
    siglip_path: ${oc.env:RLINF_RECAP_SIGLIP_PATH}
    gemma3_path: ${oc.env:RLINF_GEMMA_PATH}
    tokenizer_path: ${oc.env:RLINF_GEMMA_PATH}
  optim:
    lr_warmup_steps: 100
    total_training_steps: 2000
