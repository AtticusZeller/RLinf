runner:
  logger:
    experiment_name: value
  max_epochs: -1
  max_steps: 1000
  val_check_interval: 250
  save_interval: 1000

data:
  tag: recap_task0_mvp_seed${oc.env:RLINF_EXPERIMENT_SEED,0}_returns
  train_data_paths:
    - dataset_path: ${oc.env:RLINF_RECAP_MVP_DATA_ROOT,/mnt/data/atticux/rlinf/datasets/RECAP-Libero10-Task0-MVP}/libero10_task0_sft
      type: sft
      weight: 1.0
      robot_type: libero
      model_type: pi05
    - dataset_path: ${oc.env:RLINF_RECAP_MVP_DATA_ROOT,/mnt/data/atticux/rlinf/datasets/RECAP-Libero10-Task0-MVP}/libero10_task0_eval
      type: rollout
      weight: 1.0
      robot_type: libero
      model_type: pi05
  eval_data_paths:
    - dataset_path: ${oc.env:RLINF_RECAP_MVP_DATA_ROOT,/mnt/data/atticux/rlinf/datasets/RECAP-Libero10-Task0-MVP}/libero10_task0_sft
      max_samples: 512
      robot_type: libero
      model_type: pi05
  seed: ${oc.decode:${oc.env:RLINF_EXPERIMENT_SEED,0}}

actor:
  seed: ${oc.decode:${oc.env:RLINF_EXPERIMENT_SEED,0}}
  model:
    siglip_path: ${oc.env:RLINF_RECAP_SIGLIP_PATH,/mnt/data/atticux/rlinf/models/siglip2-so400m-patch14-224}
    gemma3_path: ${oc.env:RLINF_GEMMA_PATH,/mnt/data/atticux/rlinf/models/gemma-3-270m}
    tokenizer_path: ${oc.env:RLINF_GEMMA_PATH,/mnt/data/atticux/rlinf/models/gemma-3-270m}
  optim:
    lr_warmup_steps: 100
    total_training_steps: 1000
