# Usage:
#   bash examples/offline_rl/advantage_labeling/recap/run_value_sft.sh \
#     recap_value_model_sft +experiment@_global_=recap_libero10_task0_value

runner:
  logger:
    experiment_name: value
  max_epochs: -1
  max_steps: 8000
  val_check_interval: 500
  save_interval: 8000

data:
  tag: recap_task0_seed${oc.env:RLINF_EXPERIMENT_SEED,0}_returns
  train_data_paths:
    - dataset_path: ${oc.env:RLINF_RECAP_DATA_ROOT,/mnt/data/atticux/rlinf/datasets/RECAP-Libero10-Task0-48succ-Data}/libero10_task0_sft
      type: sft
      weight: 1.0
      robot_type: libero
      model_type: pi05
    - dataset_path: ${oc.env:RLINF_RECAP_DATA_ROOT,/mnt/data/atticux/rlinf/datasets/RECAP-Libero10-Task0-48succ-Data}/libero10_task0_train
      type: rollout
      weight: 1.0
      robot_type: libero
      model_type: pi05
  eval_data_paths:
    - dataset_path: ${oc.env:RLINF_RECAP_DATA_ROOT,/mnt/data/atticux/rlinf/datasets/RECAP-Libero10-Task0-48succ-Data}/libero10_task0_eval
      max_samples: 10000
      robot_type: libero
      model_type: pi05
  seed: ${oc.decode:${oc.env:RLINF_EXPERIMENT_SEED,0}}

actor:
  seed: ${oc.decode:${oc.env:RLINF_EXPERIMENT_SEED,0}}
  model:
    siglip_path: ${oc.env:RLINF_RECAP_SIGLIP_PATH,/mnt/data/atticux/rlinf/models/siglip2-so400m-patch14-224}
    gemma3_path: ${oc.env:RLINF_GEMMA_PATH,/mnt/data/atticux/rlinf/models/gemma-3-270m}
    tokenizer_path: ${oc.env:RLINF_GEMMA_PATH,/mnt/data/atticux/rlinf/models/gemma-3-270m}
