runner:
  logger:
    experiment_name: policy
  max_epochs: -1
  max_steps: 200
  val_check_interval: -1
  save_interval: 200

data:
  advantage_tag: steam_task0_mvp_seed${oc.env:RLINF_EXPERIMENT_SEED,0}_k32_e3_q30
  seed: ${oc.decode:${oc.env:RLINF_EXPERIMENT_SEED,0}}
  train_data_paths:
    - dataset_path: ${oc.env:RLINF_RECAP_MVP_DATA_ROOT,/mnt/data/atticux/rlinf/datasets/RECAP-Libero10-Task0-MVP}/libero10_task0_sft
      type: sft
      weight: 1.0
    - dataset_path: ${oc.env:RLINF_RECAP_MVP_DATA_ROOT,/mnt/data/atticux/rlinf/datasets/RECAP-Libero10-Task0-MVP}/libero10_task0_eval
      type: rollout
      weight: 1.0

actor:
  seed: ${oc.decode:${oc.env:RLINF_EXPERIMENT_SEED,0}}
  global_batch_size: 256
  model:
    model_path: ${oc.env:RLINF_PI05_MODEL_PATH,/mnt/data/atticux/rlinf/models/RLinf-Pi05-LIBERO-SFT}
  optim:
    lr_warmup_steps: 20
    total_training_steps: 200
